services:
  postgres:
    image: postgres:16-alpine
    container_name: prithvinet-db
    environment:
      POSTGRES_USER: prithvinet
      POSTGRES_PASSWORD: prithvinet123
      POSTGRES_DB: prithvinet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prithvinet"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prithvinet-backend
    environment:
      DATABASE_URL: postgresql://prithvinet:prithvinet123@postgres:5432/prithvinet
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
